<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset viewer (dev) &mdash; Surgical Trainer</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1216;
        color: #d9e2ea;
        font: 13px system-ui, sans-serif;
      }
      #viewer {
        position: fixed;
        inset: 0;
      }
      #viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 270px;
        padding: 12px;
        background: rgba(14, 18, 22, 0.9);
        border: 1px solid #26313b;
        border-radius: 8px;
      }
      #panel select {
        width: 100%;
        margin: 8px 0 4px;
      }
      #panel label {
        display: block;
        margin: 5px 0;
      }
      #panel ul {
        margin: 4px 0 8px;
        padding-left: 18px;
      }
      #panel .ok {
        color: #6fdc8c;
      }
      #panel .bad {
        color: #ff8b7b;
      }
      #panel .muted {
        color: #8494a3;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <aside id="panel"></aside>
    <script type="module" src="/src/dev/assetViewer.ts"></script>
  </body>
</html>
